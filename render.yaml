services:
  - type: web
    name: investreport
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /healthz
    disk:
      name: data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      # ── Required ──────────────────────────────────────────────────────────
      - key: GOOGLE_CREDENTIALS_JSON
        sync: false             # Render dashboard 貼上 JSON 內容
      - key: GOOGLE_DRIVE_FOLDER_ID
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false             # build-time arg，Google OAuth 用
      # ── Optional ─────────────────────────────────────────────────────────
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: ALLOWED_ORIGINS
        value: ""
      - key: DATABASE_PATH
        value: /app/data/investreport.db
      - key: DATABASE_URL
        value: ""
